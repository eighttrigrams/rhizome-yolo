services:
  claude:
    hostname: yolo-box
    build:
      context: .
      dockerfile: Dockerfile.yolo
      args:
        WITH_VEC: "${WITH_VEC:-0}"
    volumes:
      - workspace:/workspace
      - ../:/workspace/rhizome:rw
      - ./.mcp.json:/workspace/rhizome/.mcp.json:rw
      - ./.claude/settings.json:/workspace/rhizome/.claude/settings.json:rw
      - ./package-lock.json:/workspace/rhizome/package-lock.json:rw
      - m2_cache:/home/claude/.m2
      - npm_cache:/home/claude/.npm
      - claude_home:/home/claude/.claude
      - cpcache:/workspace/rhizome/.cpcache
      - shadow_cache:/workspace/rhizome/.shadow-cljs
      - node_modules:/workspace/rhizome/node_modules
    working_dir: /workspace/rhizome
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - SQLITE_VEC_PATH=/usr/local/lib/sqlite-vec/vec0
      - OLLAMA_URL=http://ollama-proxy:11434
      - RHIZOME_BIND_ALL=1
    depends_on:
      - ollama-proxy
    extra_hosts:
      - "host.docker.internal:0.0.0.0"
    ports:
      - "3006:3006"
      - "9630:9630"
    stdin_open: true
    tty: true

  ollama-proxy:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 11434;
          location / {
            proxy_pass http://host.docker.internal:11434;
            proxy_set_header Host 127.0.0.1:11434;
          }
        }
        EOF
        exec nginx -g 'daemon off;'

  box:
    hostname: dev-box
    build:
      context: .
      dockerfile: Dockerfile.box
      args:
        WITH_VEC: "${WITH_VEC:-0}"
    volumes:
      - box_workspace:/workspace
      - ../:/workspace/rhizome:rw
      - box_m2_cache:/root/.m2
      - box_npm_cache:/root/.npm
      - box_cpcache:/workspace/rhizome/.cpcache
      - box_shadow_cache:/workspace/rhizome/.shadow-cljs
      - box_node_modules:/workspace/rhizome/node_modules
    working_dir: /workspace/rhizome
    environment:
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - SQLITE_VEC_PATH=/usr/local/lib/sqlite-vec/vec0
      - OLLAMA_URL=http://ollama-proxy:11434
      - RHIZOME_BIND_ALL=1
    depends_on:
      - ollama-proxy
    extra_hosts:
      - "host.docker.internal:0.0.0.0"
    ports:
      - "3006:3006"
      - "9630:9630"
    stdin_open: true
    tty: true

volumes:
  workspace:
  m2_cache:
  npm_cache:
  claude_home:
  cpcache:
  shadow_cache:
  node_modules:
  box_workspace:
  box_m2_cache:
  box_npm_cache:
  box_cpcache:
  box_shadow_cache:
  box_node_modules:
