# Shared bits factored as YAML anchors. Both app services point at the same
# Dockerfile and differ only in the `target:` stage (yolo vs box) plus the
# user/MCP-specific bits the agent container needs. Ollama runs as a sidecar
# (`ollama` service) that both app services talk to over the compose network,
# so the binary + model live in one shared volume instead of being installed
# per app container.
x-build-args: &build-args
  WITH_VEC: "${WITH_VEC:-0}"

x-common-env: &common-env
  # config.edn (bind-mounted from the repo) is the single source of truth for
  # :port and :ollama-url. Inside the container, entrypoint.sh runs a socat
  # bridge so 127.0.0.1:11434 reaches the `ollama` sidecar, which lets the
  # same :ollama-url "http://127.0.0.1:11434" work on host and in container.
  SQLITE_VEC_PATH: /usr/local/lib/sqlite-vec/vec0
  RHIZOME_BIND_ALL: 1
  # Surfaced to onboard.sh so `make box PORT=3007` followed by `make onboard`
  # inside the container writes config.edn (and docker/.env) with these
  # values. Defaults match the compose port-mapping defaults below.
  PORT: "${PORT:-3006}"
  SHADOW_PORT: "${SHADOW_PORT:-8020}"
  SHADOW_NREPL_PORT: "${SHADOW_NREPL_PORT:-9630}"

x-common-ports: &common-ports
  - "${PORT:-3006}:${PORT:-3006}"
  - "${SHADOW_PORT:-8020}:${SHADOW_PORT:-8020}"
  - "${SHADOW_NREPL_PORT:-9630}:${SHADOW_NREPL_PORT:-9630}"

services:
  # Official Ollama image runs serve on entry. The first time the app starts
  # it asks this sidecar to pull nomic-embed-text into ollama_models (see
  # entrypoint.sh); subsequent runs find the model already cached. Gated by
  # the `vec` compose profile -- only activated when WITH_VEC=1 (see Makefile)
  # so users who don't need semsearch never pull this 3 GB image.
  ollama:
    image: ollama/ollama:latest
    profiles: ["vec"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  claude:
    hostname: yolo-box
    build:
      context: .
      dockerfile: Dockerfile
      target: yolo
      args: *build-args
    volumes:
      - workspace:/workspace
      - ../:/workspace/rhizome:rw
      - ./.mcp.json:/workspace/rhizome/.mcp.json:rw
      - ./.claude/settings.json:/workspace/rhizome/.claude/settings.json:rw
      - ./package-lock.json:/workspace/rhizome/package-lock.json:rw
      - m2_cache:/home/claude/.m2
      - npm_cache:/home/claude/.npm
      - claude_home:/home/claude/.claude
      - cpcache:/workspace/rhizome/.cpcache
      - shadow_cache:/workspace/rhizome/.shadow-cljs
      - node_modules:/workspace/rhizome/node_modules
    working_dir: /workspace/rhizome
    environment:
      <<: *common-env
      # yolo-only: lets the agent invoke `claude` and Playwright/Chromium.
      CLAUDE_CODE_OAUTH_TOKEN:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    ports: *common-ports
    # `required: false` lets the dependency be silently skipped when the
    # `vec` profile isn't active (ollama service then isn't part of the
    # project). Compose v2.20+.
    depends_on:
      ollama:
        condition: service_started
        required: false
    stdin_open: true
    tty: true

  box:
    hostname: dev-box
    build:
      context: .
      dockerfile: Dockerfile
      target: box
      args: *build-args
    volumes:
      - box_workspace:/workspace
      - ../:/workspace/rhizome:rw
      - box_m2_cache:/root/.m2
      - box_npm_cache:/root/.npm
      - box_cpcache:/workspace/rhizome/.cpcache
      - box_shadow_cache:/workspace/rhizome/.shadow-cljs
      - box_node_modules:/workspace/rhizome/node_modules
    working_dir: /workspace/rhizome
    environment:
      <<: *common-env
    ports: *common-ports
    # `required: false` lets the dependency be silently skipped when the
    # `vec` profile isn't active (ollama service then isn't part of the
    # project). Compose v2.20+.
    depends_on:
      ollama:
        condition: service_started
        required: false
    stdin_open: true
    tty: true

volumes:
  workspace:
  m2_cache:
  npm_cache:
  claude_home:
  ollama_models:
  cpcache:
  shadow_cache:
  node_modules:
  box_workspace:
  box_m2_cache:
  box_npm_cache:
  box_cpcache:
  box_shadow_cache:
  box_node_modules:
