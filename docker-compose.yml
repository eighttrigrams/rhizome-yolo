services:
  claude:
    build: .
    volumes:
      - ../:/workspace:rw
      - ./config.edn:/workspace/config.edn:rw
      - ./test_config.edn:/workspace/test/test_config.edn:rw
      - ./e2e_config.edn:/workspace/test/e2e_config.edn:rw
      - ./.mcp.json:/workspace/.mcp.json:rw
      - /Users/daniel/Workspace/eighttrigrams/tracker.project/tracker/files:/Users/daniel/Workspace/eighttrigrams/tracker.project/tracker/files:rw
      - ../../claude-stuff:/workspace/claude-stuff:rw
      - ../../tracker:/workspace/tracker:rw
      - /Users/daniel/.gitconfig:/home/claude/.gitconfig:ro
      - m2_cache:/home/claude/.m2
      - npm_cache:/home/claude/.npm
      - claude_home:/home/claude/.claude
      - cpcache:/workspace/.cpcache
      - shadow_cache:/workspace/.shadow-cljs
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - SQLITE_VEC_PATH=/usr/local/lib/sqlite-vec/vec0
      - OLLAMA_URL=http://ollama-proxy:11434
    depends_on:
      - ollama-proxy
    extra_hosts:
      - "host.docker.internal:0.0.0.0"
    ports:
      - "3006:3006"
      - "9630:9630"
    stdin_open: true
    tty: true

  ollama-proxy:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 11434;
          location / {
            proxy_pass http://host.docker.internal:11434;
            proxy_set_header Host 127.0.0.1:11434;
          }
        }
        EOF
        exec nginx -g 'daemon off;'

volumes:
  m2_cache:
  npm_cache:
  claude_home:
  cpcache:
  shadow_cache:
  node_modules:
