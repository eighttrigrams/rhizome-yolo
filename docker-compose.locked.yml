# Compose override that locks the yolo container's outbound traffic to
# api.anthropic.com only. Applied by docker/run.sh unless it is called as
# `./run.sh +internet` (see there). Mirrors ../../docker/docker-compose.locked.yml,
# which does the same for the plurama box.
#
# Only the `claude` (yolo) service is locked. `box` is deliberately left on the
# default bridge with open internet: it is the plain root dev shell a human
# drives, not an agent surface, and CLAUDE.md only ever claimed the internet was
# cut off for `make yolo`.
#
# Two gates, not one. HTTP(S)_PROXY routes well-behaved tools through tinyproxy,
# which enforces the whitelist; anything that ignores those vars finds no
# default gateway at all, because `locked` is an internal network. The second
# gate is the one that actually holds.
#
# This works only because the yolo image resolves its dependencies at BUILD
# time -- see the pre-warm block in Dockerfile. Nothing in here is allowed to
# reach Clojars, Maven Central or the npm registry at runtime, so a cold
# .m2/node_modules volume in locked mode is a failure, not a slow first run.
services:
  claude:
    # Detach from the default bridge and put claude only on the internal
    # `locked` net (no gateway -> no direct internet). The egress proxy is the
    # only way out. The base compose file declares no `networks:` for this
    # service, so this adds the key rather than merging with one.
    networks: [locked]
    # Mapping form, not the `- KEY=value` list form: the base file's
    # `environment:` comes from the x-common-env anchor and is a mapping, and
    # compose will not merge a list into a mapping.
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      # `ollama` is reached through entrypoint.sh's socat bridge on
      # 127.0.0.1:11437, and the shadow-cljs/JVM ports are localhost too --
      # none of that may go through the proxy.
      NO_PROXY: localhost,127.0.0.1,egress,ollama
    # depends_on is what makes `docker compose run claude` bring the sidecars
    # up too. The base file already depends on ollama (required: false); listing
    # it again here would drop that flag, so it is deliberately absent.
    depends_on:
      egress:
        condition: service_started
      ingress:
        condition: service_started
      ingress-shadow:
        condition: service_started

  egress:
    # Dual-homed sidecar: reachable from claude on `locked`, can route out via
    # `outside`. tinyproxy enforces the whitelist (see tinyproxy.filter).
    # Built locally from tinyproxy.Dockerfile -- see that file for why we don't
    # pull a public tinyproxy image.
    build:
      context: .
      dockerfile: tinyproxy.Dockerfile
    networks: [locked, outside]
    restart: unless-stopped

  # Host -> container port forwarders. Docker won't bind published ports on a
  # container that's only attached to an `internal: true` network (the
  # PortBindings request is silently dropped), so the in-container JVM and
  # shadow-cljs would be unreachable from the host browser. socat listens on
  # the bridge network (where Docker happily publishes ports) and forwards into
  # the locked network to claude:<port>.
  #
  # `command:` and `ports:` for each ingress are filled in by
  # compose.ports.locked.yml, generated by scripts/write-compose-ports.sh so
  # they track .envrc / config.edn / shadow-cljs.edn like the open-mode
  # bindings do.
  ingress:
    image: alpine/socat
    networks: [locked, outside]
    restart: unless-stopped

  ingress-shadow:
    image: alpine/socat
    networks: [locked, outside]
    restart: unless-stopped

  # `locked` ONLY, deliberately, even though that means a cold ollama_models
  # volume cannot pull its model. Joining `outside` as well would let the model
  # pull work unattended, and was the first version of this file -- but it hands
  # the box a way out. Ollama's API needs no auth and `POST /api/pull` takes a
  # model name that may carry its own registry host (`host/ns/model`), so
  # anything in the box could ask a dual-homed ollama to connect to a host of
  # its choosing. That is the same broad exfil channel we declined to open by
  # whitelisting Clojars and npm, wearing a different hat.
  #
  # So the model is treated like every other dependency here: seeded once from
  # open mode, then used offline. See "Locked egress" in README.md.
  # entrypoint.sh already degrades on a cold volume -- it logs
  # "model pull failed" and carries on with semsearch unavailable.
  #
  # `profiles: ["vec"]` from the base file still applies, so this is inert
  # unless WITH_VEC=1.
  ollama:
    networks: [locked]

networks:
  # internal: true removes the default gateway -> no container on this network
  # can reach the internet directly. Only the dual-homed sidecars can.
  locked:
    internal: true
  # Plain bridge so the egress proxy (and ollama) have internet access.
  outside:
    driver: bridge
