User nobody
# Alpine doesn't ship a `nogroup`; the `nobody` user is in group `nobody`.
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 100

# Whitelist mode: deny everything except hosts matching ./tinyproxy.filter.
# Without FilterDefaultDeny Yes, the filter would act as a blacklist instead.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off

# HTTPS uses CONNECT; api.anthropic.com is HTTPS-only, so 443 is the only port
# we need to allow. Adding more ConnectPort lines would widen the tunnel.
ConnectPort 443
